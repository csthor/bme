name: Docker Image CI
on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
env:
  IMAGE_NAME: toptuji/kupon4uk
  VERSION_PREFIX: D-00-01
jobs:
  build_job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with: 
          context: --file Dockerfile
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERUSER }}
          password: ${{ secrets.DOCKERTOKENRW }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.VERSION_PREFIX }}-${{ github.run_number }}
            ${{ env.IMAGE_NAME }}:latest
      - name: Deploy on remote
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSHUSERNAME }}
          key: ${{ secrets.SSHKEY }}
          port: ${{ secrets.SSHPORT }}
          script: |
            sed -i 's|^\s*image:.*|image: '${env.IMAGE_NAME}':'${env.VERSION_PREFIX}'-'${'{github.run_number}'}|' /opt/kupon4UK/docker-compose.yml
            cd /opt/kupon4UK/ && docker compose restart
